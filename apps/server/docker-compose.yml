# Runs the API and workers in containers. Infra is all cloud: Postgres and Auth from
# Supabase, Redis from Upstash, storage on Cloudflare R2 (all configured in .env).
#   docker compose up -d --build
x-app: &app
  env_file: .env

services:
  api:
    <<: *app
    build: { context: ../.., dockerfile: apps/server/Dockerfile, target: api }
    ports: ["8000:8000"]

  worker-cpu:
    <<: *app
    build: { context: ../.., dockerfile: apps/server/Dockerfile, target: worker }
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "cpu,default", "-c", "4", "-l", "INFO"]

  worker-gpu:
    <<: *app
    build: { context: ../.., dockerfile: apps/server/Dockerfile, target: worker }  # use target worker-gpu on NVIDIA hosts
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "gpu", "-c", "1", "-l", "INFO"]

  beat:
    <<: *app
    build: { context: ../.., dockerfile: apps/server/Dockerfile, target: worker }
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "INFO"]
