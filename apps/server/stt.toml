# Speech-to-text settings for the transcribe stage.
#
# Edit and save: the file is re-read on every transcription, so no restart is needed.
# Secrets stay in .env (ASSEMBLYAI_API_KEY). Set STT_CONFIG_PATH to use a different file.

# Which engine runs: "redux", "assemblyai" or "whisper".
provider = "redux"

# Moondream Parakeet Redux: ternary-quantized parakeet-tdt-0.6b-v3 (178 MB), run locally
# through the moondream Photon runtime. Needs the extra: uv sync --extra redux
# Punctuated, cased output with word timestamps; 25 European languages; no diarization.
[redux]
model = "moondream/parakeet-redux"
# "auto" picks CUDA, then Apple silicon (mps), then the CPU. Or "cuda", "mps", "cpu".
device = "auto"
# Parakeet detects the language itself but does not report it, and cannot be forced to one.
# This is the language recorded on the transcript when the job doesn't specify one.
fallback_language = "en"

# AssemblyAI hosted pre-recorded API. The key comes from ASSEMBLYAI_API_KEY in .env.
[assemblyai]
# https://api.eu.assemblyai.com for EU data residency.
base_url = "https://api.assemblyai.com"
# Priority list with fallback; ["universal-2"] alone is the cheapest option.
speech_models = ["universal-3-5-pro", "universal-2"]
# Diarization, a paid add-on.
speaker_labels = false

# Local faster-whisper with silero VAD.
[whisper]
# tiny, base, small, medium, large-v3, ...
model = "small"
# "auto", "cuda" or "cpu".
device = "auto"
# "auto" picks int8 on CPU and float16/int8_float16 on CUDA. Or "int8", "float16", ...
compute_type = "auto"
